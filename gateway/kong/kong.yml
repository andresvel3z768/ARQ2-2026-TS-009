services:
  - name: auth-service
    url: http://auth-service:3001
    routes:
      - name: auth-token-route
        paths: [/v1/auth/token]
        strip_path: false
      - name: auth-key-management-route
        paths: [/v1/auth/keys]
        strip_path: false
      - name: auth-token-revocation-route
        paths: [/v1/auth/tokens]
        strip_path: false
  - name: search-service
    url: http://search-service:3002
    routes:
      - name: search-routes
        paths: [/v1/fares]
        strip_path: false
  - name: booking-service
    url: http://booking-service:3003
    routes:
      - name: booking-routes
        paths: [/v1/bookings]
        strip_path: false
  - name: audit-service
    url: http://audit-service:3005
    routes:
      - name: audit-routes
        paths: [/v1/audit]
        strip_path: false
plugins:
  - name: prometheus
    config:
      per_consumer: true
  - name: correlation-id
    config:
      header_name: X-Correlation-ID
      generator: uuid
      echo_downstream: true
  - name: rate-limiting
    config:
      minute: 120
      policy: redis
      redis_host: valkey
      redis_port: 6379
      fault_tolerant: false
  - name: jwt
    route: { name: search-routes }
    config:
      claims_to_verify: [exp]
      key_claim_name: iss
      header_names: [authorization]
  - name: jwt
    route: { name: booking-routes }
    config:
      claims_to_verify: [exp]
      key_claim_name: iss
      header_names: [authorization]
  - name: jwt
    route: { name: audit-routes }
    config:
      claims_to_verify: [exp]
      key_claim_name: iss
      header_names: [authorization]
  - name: jwt
    route: { name: auth-key-management-route }
    config:
      claims_to_verify: [exp]
      key_claim_name: iss
      header_names: [authorization]
  - name: jwt
    route: { name: auth-token-revocation-route }
    config:
      claims_to_verify: [exp]
      key_claim_name: iss
      header_names: [authorization]
  - name: jwt-revocation
    route: { name: search-routes }
    config: { redis_host: valkey, redis_port: 6379 }
  - name: jwt-revocation
    route: { name: booking-routes }
    config: { redis_host: valkey, redis_port: 6379 }
  - name: jwt-revocation
    route: { name: audit-routes }
    config: { redis_host: valkey, redis_port: 6379 }
  - name: jwt-revocation
    route: { name: auth-key-management-route }
    config: { redis_host: valkey, redis_port: 6379 }
  - name: jwt-revocation
    route: { name: auth-token-revocation-route }
    config: { redis_host: valkey, redis_port: 6379 }
  - name: idempotency
    config:
      redis_host: valkey
      redis_port: 6379
      ttl: 86400
      required_paths: ["/v1/bookings"]
